services:
  postgres:
    image: postgres:17
    container_name: idenova-postgres
    environment:
      POSTGRES_USER: idenova
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: verification
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: